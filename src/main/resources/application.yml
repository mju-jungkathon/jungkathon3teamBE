spring:
  application:
    name: aftergrow
  profiles:
    active: local

# 배포 환경은 nginx가 TLS를 종료하고 8080으로 평문 프록시한다. 이 값이 없으면
# request.getScheme()이 항상 http로 보여, 브라우저가 보낸 Origin(https)과 어긋나
# 완전한 동일 출처 요청까지 CORS 대상으로 오판해 차단한다(Swagger 로그인 403 원인).
server:
  forward-headers-strategy: framework

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  timeout-ms: ${OPENAI_TIMEOUT_MS:8000}

# 기상청 생활기상지수(자외선지수) 서비스키.
# 비워두면 UV 예보가 모의값으로 응답합니다(CI가 외부 API에 의존하지 않도록).
# 기본값이 있으므로 프로파일별 yml에 따로 넣을 필요는 없습니다.
kma:
  auth-key: ${KMA_AUTH_KEY:}