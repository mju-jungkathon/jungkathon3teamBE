spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aftergrow
    username: postgres
    password: 1027
  jpa:
    hibernate:
      ddl-auto: update   # 처음엔 update로 시작, 마이그레이션 파일 갖추면 validate로 전환
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: local-dev-secret-key-please-change-in-real-env-1234567890
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 2592000000

logging:
  level:
    jungkathon3team.aftergrow: DEBUG
    org.hibernate.SQL: DEBUG